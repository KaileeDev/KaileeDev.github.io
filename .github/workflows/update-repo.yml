name: Update APT repository index

on:
  push:
    paths:
      - 'debs/*.deb'
      - '.github/workflows/update-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Generate Packages indexes
        run: |
          dpkg-scanpackages debs /dev/null > Packages
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Packages')
          stanzas = [s for s in path.read_text(encoding='utf-8').strip().split('\n\n') if s.strip()]

          metadata = {
              'com.hiddenspace.tweak': {
                  'Name': 'HiddenSpace-Rootless',
                  'Icon': 'https://raw.githubusercontent.com/KaileeDev/HiddenSpace/main/assets/icon.png',
                  'SileoDepiction': 'https://kaileedev.github.io/depictions/com.hiddenspace.tweak.json',
              },
              'com.hiddenspace.tweak.roothide': {
                  'Name': 'HiddenSpace-roothide',
                  'Icon': 'https://raw.githubusercontent.com/KaileeDev/HiddenSpace/main/assets/icon.png',
                  'SileoDepiction': 'https://kaileedev.github.io/depictions/com.hiddenspace.tweak.json',
              },
          }

          out = []
          for stanza in stanzas:
              lines = stanza.splitlines()
              package = next((line.split(':', 1)[1].strip() for line in lines if line.startswith('Package:')), '')
              wanted = metadata.get(package)
              if wanted:
                  seen = set()
                  new_lines = []
                  for line in lines:
                      key = line.split(':', 1)[0] if ':' in line else ''
                      if key in wanted:
                          new_lines.append(f'{key}: {wanted[key]}')
                          seen.add(key)
                      else:
                          new_lines.append(line)
                  for key, value in wanted.items():
                      if key not in seen:
                          new_lines.append(f'{key}: {value}')
                  lines = new_lines
              out.append('\n'.join(lines))

          path.write_text('\n\n'.join(out) + '\n\n', encoding='utf-8')
          PY
          gzip -9 -c Packages > Packages.gz

      - name: Update displayed current versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def package_versions(path):
              versions = {}
              stanzas = [s for s in Path(path).read_text(encoding='utf-8').strip().split('\n\n') if s.strip()]
              for stanza in stanzas:
                  fields = {}
                  for line in stanza.splitlines():
                      if ': ' in line:
                          key, value = line.split(': ', 1)
                          fields[key] = value
                  package = fields.get('Package')
                  version = fields.get('Version')
                  if package and version:
                      versions[package] = version
              return versions

          versions = package_versions('Packages')
          rootless = versions.get('com.hiddenspace.tweak')
          roothide = versions.get('com.hiddenspace.tweak.roothide')
          if not rootless or not roothide:
              raise SystemExit('Missing rootless or RootHide package in Packages index')

          p = Path('README.md')
          lines = p.read_text(encoding='utf-8').splitlines()
          section = None
          out = []
          for line in lines:
              if line == '### HiddenSpace / 隐藏空间（rootless）':
                  section = 'rootless'
              elif line == '### HiddenSpace / 隐藏空间（RootHide）':
                  section = 'roothide'
              elif line.startswith('### '):
                  section = None

              if line.startswith('- Current beta candidate: `'):
                  if section == 'rootless':
                      line = f'- Current beta candidate: `{rootless}`'
                  elif section == 'roothide':
                      line = f'- Current beta candidate: `{roothide}`'
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')

          p = Path('debs/README.md')
          p.write_text(
              '# Packages\n\n'
              'Place published `.deb` files in this directory. The current `Packages` index expects:\n\n'
              f'- `com.hiddenspace.tweak_{rootless}_iphoneos-arm64.deb`\n'
              f'- `com.hiddenspace.tweak.roothide_{roothide}_iphoneos-arm64e.deb`\n',
              encoding='utf-8',
          )
          PY

      - name: Commit generated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages Packages.gz README.md debs/README.md
          if git diff --cached --quiet; then
            echo 'No index changes.'
          else
            git commit -m 'Update APT index'
            git push
          fi
